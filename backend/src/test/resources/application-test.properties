# Used only when tests run with @ActiveProfiles("test").
# Keeps the test suite self-contained - it never touches your local
# Postgres or the demo data in it.
spring.datasource.url=jdbc:h2:mem:expense_claims_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

app.jwt.secret=test-only-secret-not-for-any-real-use-but-long-enough-for-hmac
app.jwt.expiry-minutes=60
app.cors.allowed-origins=http://localhost:5173
app.uploads.dir=target/test-uploads
app.seed.enabled=true
