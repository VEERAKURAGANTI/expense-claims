spring.application.name=expense-claims

# --- Database ---
# Point this at your own Postgres instance. Defaults assume a local
# Postgres with a database called expense_claims already created:
#   createdb expense_claims
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/expense_claims}
spring.datasource.username=postgres
spring.datasource.password=Veera@198
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# Override app.jwt.secret in production - this default is only fine for
# local/demo use. Needs to be reasonably long since it's used as an HMAC key.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-before-any-real-deployment-please}
app.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:480}

# --- CORS ---
# Comma-separated list of origins the React dev/build is served from.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}

# --- File uploads (receipt photos) ---
app.uploads.dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# --- Seed data ---
# Set to false to skip re-seeding on every restart once you have real data.
app.seed.enabled=${SEED_ENABLED:true}

server.port=${PORT:8080}
